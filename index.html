<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" type="text/css" href="./index.css" />
  <title>Frontend Mentor | QR code component</title>
</head>
<body style="overflow: hidden;">
  <main>
    <figure id="qr-code">
      <picture style="display: block;">
        <img src="./assets/images/image-qr-code.png" width="100%" height="100%" style="border-radius: 10px;" />
      </picture>
      <figcaption class="qr-code-info">
        <h1 class="qr-code-title">Improve your front-end skills by building projects</h1>
        <p class="qr-code-description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </figcaption>
    </figure>
  </main>
</body>
</html>
